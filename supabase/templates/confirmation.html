<!--
  E-mail de confirmation d'inscription.
  À coller dans Supabase : Authentication > Emails > Confirm signup.
  Objet : Confirmez votre adresse e-mail
-->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #18181b;">
  <p style="font-size: 20px; font-weight: bold; margin: 0 0 24px;">Monibook</p>
  <p style="font-size: 16px; line-height: 1.5; margin: 0 0 16px;">Bonjour,</p>
  <p style="font-size: 16px; line-height: 1.5; margin: 0 0 24px;">
    Merci de votre inscription. Pour activer votre compte, confirmez votre adresse e-mail :
  </p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .ConfirmationURL }}"
       style="display: inline-block; background: #18181b; color: #ffffff; text-decoration: none; font-size: 16px; padding: 12px 20px; border-radius: 8px;">
      Confirmer mon adresse e-mail
    </a>
  </p>
  <p style="font-size: 14px; line-height: 1.5; color: #52525b; margin: 0 0 8px;">
    Ce lien est valable 24 heures. Si vous n'êtes pas à l'origine de cette inscription, ignorez simplement ce message.
  </p>
</div>
